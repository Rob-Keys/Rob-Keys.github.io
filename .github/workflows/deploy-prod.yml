name: Deploy to prod

# Promotes a build of the site to the `prod` branch, which Cloudflare
# Pages watches and rebuilds from on every push. The `prod` branch contains
# only the files the site actually serves at runtime -- no source tooling,
# docs, or config. Pushes to `main` deploy automatically; the workflow can
# also be run from the Actions tab for another ref.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to deploy'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          path: source

      - name: Install dependencies and build
        working-directory: source
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build trimmed prod worktree
        working-directory: source
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin prod
          git worktree add -B prod /tmp/prod-worktree origin/prod

          # Wipe the worktree down to bare .git, then repopulate with the
          # production build plus wrangler.jsonc, which Cloudflare Workers
          # Builds reads from this branch on every push and must not be dropped.
          find /tmp/prod-worktree -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -r dist/. /tmp/prod-worktree/
          cp wrangler.jsonc /tmp/prod-worktree/

      - name: Commit and push if changed
        working-directory: /tmp/prod-worktree
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy -- prod already matches ${{ inputs.ref }}."
            exit 0
          fi

          SOURCE_SHA=$(git -C "${GITHUB_WORKSPACE}/source" rev-parse --short HEAD)
          git commit -m "Deploy ${{ inputs.ref }}@${SOURCE_SHA} to prod"
          git push origin HEAD:prod
